# 用途：Clash Party 的 YAML 覆写，保留订阅节点并替换分流规则与策略组。
# 导入：在应用的“覆写”页面添加本文件，再绑定到已有节点订阅；不需要订阅转换器或整理脚本。
# 设置：端口、局域网访问、控制器口令和 TUN 开关由应用管理，本文件不强行启用它们。
# 合并：带感叹号的对象是 Clash Party 的整段替换语法，不能直接交给 Mihomo 作为完整配置。
# 更新：自建规则直接引用仓库 rules/ 源文件；改规则后在本应用刷新规则集即可。

# 桌面通用设置；应用常用设置的优先级仍然高于本覆写。
mode: rule
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
keep-alive-idle: 300
keep-alive-interval: 30
profile:
  store-selected: true
  store-fake-ip: true

# 嗅探用于识别域名，不修改连接目标；整段替换避免继承订阅中的冲突选项。
sniffer!:
  enable: true
  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: false
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  force-domain:
  - +.v2ex.com
  skip-domain:
  - Mijia Cloud
  - dlg.io.mi.com
  - +.push.apple.com
  - +.apple.com

# 使用此 DNS 方案时关闭应用的“DNS 覆写”，避免应用设置覆盖下面的分流解析。
# 节点域名由直连 DNS 引导解析，境外业务 DNS 明确经过节点选择，避免启动时的解析循环。
dns!:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  prefer-h3: false
  respect-rules: true
  use-system-hosts: true
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - rule-set:private_domain
  - +.lan
  - +.local
  - +.localhost
  - +.home.arpa
  - +.direct
  - +.msftconnecttest.com
  - +.msftncsi.com
  - captive.apple.com
  - localhost.ptlogin2.qq.com
  - localhost.sec.qq.com
  - localhost.work.weixin.qq.com
  - time.*.com
  - time.*.gov
  - time.*.edu.cn
  - time.*.apple.com
  - time-ios.apple.com
  - time1.*.com
  - time2.*.com
  - time3.*.com
  - time4.*.com
  - time5.*.com
  - time6.*.com
  - time7.*.com
  - ntp.*.com
  - ntp1.*.com
  - ntp2.*.com
  - ntp3.*.com
  - '*.time.edu.cn'
  - '*.ntp.org.cn'
  - +.pool.ntp.org
  - connectivitycheck.gstatic.com
  - connectivitycheck.platform.hicloud.com
  - wifi.vivo.com.cn
  - +.nflxvideo.net
  - '*.n.n.srv.nintendo.net'
  - +.srv.nintendo.net
  - +.stun.playstation.net
  - xbox.*.microsoft.com
  - +.xboxlive.com
  - +.battlenet.com.cn
  - '*.stun.*.*.*.stun.*.*'
  - stun.*.*
  - stun.*.*.*
  - +.stun.*.*
  - +.stun.*.*.*
  - +.stun.*.*.*.*
  - +.mijia.tech
  - +.trafficmanager.net
  - lens.l.google.com
  - '*.mcdn.bilivideo.cn'
  - music.163.com
  - '*.music.163.com'
  - '*.126.net'
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://8.8.8.8/dns-query#🚀 节点选择
  - https://1.1.1.1/dns-query#🚀 节点选择
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT
  direct-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT
  direct-nameserver-follow-policy: false
  nameserver-policy:
    rule-set:private_domain:
    - system
    rule-set:cn_domain:
    - https://223.5.5.5/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT

# 公共模板只用于 YAML 锚点；所有筛选组在没有节点时拒绝连接，不自动退回直连。
x-clashrule-common:
  exclude: &exclude "(?i)(失联|超时|官网|售后|客服|剩余|到期|过期|自助|主流|流量|重置|订阅|网址|群组|邀请|返利|电报|无效|套餐|expire|traffic|reset|renew|website|invite)"
  test: &test
    type: url-test
    include-all: true
    empty-fallback: REJECT
    tolerance: 60
    interval: 600
    timeout: 5000
    url: https://www.gstatic.com/generate_204
    expected-status: '204'
    lazy: true
    exclude-filter: *exclude
  fallback: &fallback
    type: fallback
    interval: 600
    timeout: 5000
    url: https://www.gstatic.com/generate_204
    expected-status: '204'
    lazy: true
  menu: &menu
    - "🚀 节点选择"
