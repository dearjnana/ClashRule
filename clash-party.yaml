# 规则集整段替换，避免残留旧订阅中的同名地址或无用下载；不改动 proxy-providers 节点集合。
# 自建列表统一为 classical/text；上游原生二进制列表保持 domain 或 ipcidr/mrs。
# 所有缓存位于应用工作目录内的独立子目录，统一每 86400 秒更新，可在客户端手动刷新。
rule-providers!:
  BanAD:
    type: http
    interval: 86400
    behavior: classical
    format: text
    proxy: 📥 规则下载
    url: https://raw.githubusercontent.com/dearjnana/ClashRule/refs/heads/main/rules/block/BanAD.list
    path: ./rule_provider/clashrule-party/BanAD.text
