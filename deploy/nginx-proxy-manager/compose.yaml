# 部署示例；使用前确认端口、目录和访问范围。
services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
    - 8080:80
    - 8081:81
    - 8443:443
    environment:
      DB_SQLITE_FILE: /data/database.sqlite
    volumes:
    - ./data:/data
    - ./letsencrypt:/etc/letsencrypt
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
