# Sub-Store 订阅下载网关。
# 作用:客户端(尤其是 mihomo 内核刷新 proxy-provider 时)的 User-Agent 不在
# Sub-Store 的识别清单内,直接请求订阅会拿到 base64 的 v2ray 格式,内核无法
# 当作 proxy-provider 解析。此网关对"不带目标后缀"的订阅/聚合下载请求自动
# 追加 /ClashMeta,强制 Sub-Store 输出 Clash YAML;客户端侧链接保持无后缀。
# 其余路径(前端、API、已带后缀的下载)原样透传。
server {
    listen 3001;

    # /<后台路径>/download/collection/<名称> 与 /<后台路径>/download/<名称>,
    # 且后面没有更多路径段(已有目标后缀的不动)。
    location ~ ^/[^/]+/download/(collection/)?[^/]+$ {
        rewrite ^(/[^/]+/download/(collection/)?[^/]+)$ $1/ClashMeta break;
        proxy_pass http://sub-store:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://sub-store:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
