[custom]
;=================================================================
; OpenClash / Subconverter 自定义规则  ·  Fake-IP 优化版
; 优先级：
;   LAN(不含 Fake-IP 段) → 白名单/广告例外 → 广告拦截
;   → 流媒体/特殊分流(防公共 CDN 误杀) → 游戏
;   → 服务分流 → IP归属地 → GFW → 中国域名 → GEOIP,CN,no-resolve → MATCH
; 核心原则（Fake-IP）：
;   1. 域名规则才能稳定命中；IP-CIDR/GEOIP 必须 no-resolve
;   2. 绝不能把 198.18.0.0/16 写成 DIRECT（那是 Fake-IP 池，会把漏网域名全部直连黑洞）
;   3. 去掉 ChinaIp 7456 条：Fake-IP 下对域名流量无效，徒增匹配耗时
;=================================================================

;===== 0. 局域网 / 保留地址（刻意不含 198.18.0.0/16 与 0.0.0.0/8）=====
