;  4.【谷歌FCM】前置到 Google 之前 (原被 DOMAIN-KEYWORD,google 泛匹配遮蔽, FCM 策略组域名部分失效)
;  5.【GoogleCN】前置到 Google 之前实现国内直连加速 (dl.google.com/fonts/gstatic 等, 原同样被遮蔽全走代理)
;  6.【SteamCN】前置到 Steam 之前 (cm.steampowered.com 等国区下载 CDN 不再被 Steam 规则抢先走代理)
;  7.【Gemini】默认节点改为美国自动 (Google 不对香港地区开放 Gemini)
;  8.【电报】Telegram_add.list 格式错误("- " 前缀导致 0 条规则生效), 改为内联补充 IP 段
;  9.【清理】移除空规则 YouTubeMusic.list 与未被任何规则引用的 🌍 国外媒体 空组
; 10.【调整】应用户要求, 删除全部 iKuuu(☄️) 策略组(7 个定义)及其全部引用(162 处)
; 11.【新增】LD士多(🛍️) 与 赚钱(💰) 两组机场: 各含 -最优 + 港/台/日/韩/新/美 7 个组,
