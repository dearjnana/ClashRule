; 规则优先级：防误杀白名单 → 广告拦截 → 流媒体 → 特殊分流 → 游戏 → 白名单直连 → 服务分流 → GFW代理 → 中国直连 → GEOIP → FINAL
; 本次修复：
;  1.【pixiv】防误杀白名单/主规则前置到广告列表之前 (原被 BanProgramAD 遮蔽, App 初始化所需 SDK 被拦截导致无法访问)
;  2.【Adobe】放行白名单 (lcs-cops.adobe.io) 前置 (原被 Adobe_REJECT 的 adobe.io 遮蔽)
