  # (第二层: Url-test 在每个机场内存活节点中选最低延迟)
  - {name: ☁️🌏 良心云-最优, type: url-test, include-all: true, tolerance: 50, interval: 300, filter: "(?=.*良心云)^((?!(失联|超时|官网|售后|剩余|到期|自助开通|主流)).)*$"}
