# 端到端审核专用最小拓扑:与 deploy/ 相同的镜像摘要,仅挂载必要文件。
# 由 .github/workflows/lint.yml 的 e2e 任务调用,不要用于生产部署。
name: clashrule-e2e
services:
  sub-store:
    image: xream/sub-store@sha256:7e63f05cbbf50f64bff14def6d5758fc4a896397c4c9168ab39e0d079513276e
    container_name: e2e-sub-store
    restart: unless-stopped
    environment:
      SUB_STORE_FRONTEND_BACKEND_PATH: /e2e-ci
      SUB_STORE_BACKEND_API_HOST: 127.0.0.1
      SUB_STORE_FRONTEND_HOST: 0.0.0.0
    ports:
    - 3001:3001

  subconverter:
    image: aethersailor/subconverter-extended@sha256:ab7ebc278c8beda121442a57395467c43211ad076b5beb4264a92cb7199ef27a
    container_name: e2e-subconverter
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SUBCONVERTER_SECURITY_PROFILE: lan
      SUBCONVERTER_ALLOW_PUBLIC_UPLOAD: 'false'
    ports:
    - 25500:25500
    volumes:
    - ../../deploy/subconverter/lan/pref.toml:/base/pref.toml:ro
