name: 检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: 规则语法与引用检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 读取本次提交
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 YAML 解析依赖
        run: python -m pip install --quiet pyyaml

      - name: 检查规则列表与配置引用
        run: |
          python - <<'PYEOF'
          import re, sys, pathlib
          import yaml

          ROOT = pathlib.Path('.')
          REPO_URL = 'https://raw.githubusercontent.com/dearjnana/ClashRule/refs/heads/main/'
          errors = []

          # 1. rules/ 语法检查：每行是已知的规则类型，同文件内不允许重复行
          TYPES = {'DOMAIN', 'DOMAIN-SUFFIX', 'DOMAIN-KEYWORD', 'DOMAIN-REGEX',
                   'IP-CIDR', 'IP-CIDR6', 'GEOIP', 'IP-ASN', 'SRC-IP-CIDR',
                   'SRC-PORT', 'DST-PORT', 'PROCESS-NAME', 'PROCESS-PATH', 'MATCH'}
          for f in sorted(ROOT.glob('rules/**/*.list')):
              seen = {}
              for n, line in enumerate(f.read_text(encoding='utf-8').splitlines(), 1):
                  s = line.strip()
                  if not s or s.startswith('#'):
                      continue
                  kind = s.split(',', 1)[0].strip()
                  if kind not in TYPES:
                      errors.append(f'{f}:{n} 无法识别的规则类型: {kind}')
                  if s in seen:
                      errors.append(f'{f}:{n} 与第 {seen[s]} 行重复: {s[:60]}')
                  else:
                      seen[s] = n

          # 2. INI 检查：引用的仓库文件存在，目标组和被引用组都有定义
          BUILTIN = {'DIRECT', 'REJECT', 'REJECT-DROP', 'PASS', 'COMPATIBLE', 'GLOBAL', 'no-resolve'}
          RULE_PREFIX = ('GEOIP', 'MATCH', 'DST-PORT', 'SRC-PORT', 'IP-CIDR', 'IP-CIDR6', 'IP-ASN', 'RULE-SET')
          for ini in ['openclash.ini', 'android.ini']:
              text = pathlib.Path(ini).read_text(encoding='utf-8')
              defined = set()
              for line in text.splitlines():
                  if line.startswith('custom_proxy_group='):
                      defined.add(line.split('`')[0][len('custom_proxy_group='):])
              for m in re.finditer(r'^ruleset=([^,]+),(.+)$', text, re.M):
                  target, rule = m.group(1).strip(), m.group(2).strip()
                  if target not in defined and target not in BUILTIN:
                      errors.append(f'{ini}: ruleset 目标组未定义: {target}')
                  if rule.startswith(REPO_URL):
                      p = ROOT / rule[len(REPO_URL):]
                      if not p.is_file():
                          errors.append(f'{ini}: 引用的文件不存在: {p}')
                  elif not rule.startswith(('[]', 'http')):
                      errors.append(f'{ini}: 无法识别的规则来源: {rule[:60]}')
              for line in text.splitlines():
                  if not line.startswith('custom_proxy_group='):
                      continue
                  for field in line.split('`')[2:]:
                      if not field.startswith('[]'):
                          continue
                      ref = field[2:]
                      if ref.startswith(RULE_PREFIX) or ref in BUILTIN:
                          continue
                      if ref not in defined:
                          errors.append(f'{ini}: 策略组引用未定义: {ref}')

          # 3. clash-party.yaml 检查：RULE-SET 引用的规则集有定义，仓库内 URL 指向存在的文件
          cp = yaml.safe_load(pathlib.Path('clash-party.yaml').read_text(encoding='utf-8'))
          providers = cp.get('rule-providers!') or {}
          for r in cp.get('rules!') or []:
              parts = r.split(',')
              if parts[0].strip() == 'RULE-SET' and parts[1].strip() not in providers:
                  errors.append(f'clash-party.yaml: 规则引用了未定义的规则集: {parts[1].strip()}')
          for name, p in providers.items():
              url = p.get('url', '')
              if url.startswith(REPO_URL) and not (ROOT / url[len(REPO_URL):]).is_file():
                  errors.append(f'clash-party.yaml: 规则集 {name} 引用的文件不存在: {url}')

          if errors:
              print('\n'.join(errors))
              print(f'\n共 {len(errors)} 个问题')
              sys.exit(1)
          print('检查通过：规则语法、文件引用和策略组引用均正常。')
          PYEOF

      - name: 检查换行与空白
        run: |
          git diff --check
          if git grep -qI $'\r' -- 'rules/*.list' '*.ini' 'clash-party.yaml'; then
            echo '发现 CRLF 换行，请使用 LF。' && exit 1
          fi
