name: 检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: 自动审核
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 读取本次提交
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 YAML 解析依赖
        run: python -m pip install --quiet pyyaml

      - name: 校验规则、INI 与覆写文件
        run: |
          python - <<'PYEOF'
          import re, sys, pathlib
          import yaml

          ROOT = pathlib.Path('.')
          RAW = 'https://raw.githubusercontent.com/dearjnana/ClashRule/refs/heads/main/'
          BUILTIN = {'DIRECT', 'REJECT', 'REJECT-DROP', 'PASS', 'COMPATIBLE', 'GLOBAL', 'no-resolve'}
          RULE_PREFIX = ('GEOIP', 'MATCH', 'DST-PORT', 'SRC-PORT', 'IP-CIDR', 'IP-CIDR6', 'IP-ASN', 'RULE-SET')
          errors = []

          # ===== 1. rules/ 规则列表:语法 + 同文件重复行 =====
          TYPES = {'DOMAIN', 'DOMAIN-SUFFIX', 'DOMAIN-KEYWORD', 'DOMAIN-REGEX',
                   'IP-CIDR', 'IP-CIDR6', 'GEOIP', 'IP-ASN', 'SRC-IP-CIDR',
                   'SRC-PORT', 'DST-PORT', 'PROCESS-NAME', 'PROCESS-PATH', 'MATCH'}
          for f in sorted(ROOT.glob('rules/**/*.list')):
              seen = {}
              for n, line in enumerate(f.read_text(encoding='utf-8').splitlines(), 1):
                  s = line.strip()
                  if not s or s.startswith('#'):
                      continue
                  kind = s.split(',', 1)[0].strip()
                  if kind not in TYPES:
                      errors.append(f'{f}:{n} 无法识别的规则类型: {kind}')
                  if s in seen:
                      errors.append(f'{f}:{n} 与第 {seen[s]} 行重复: {s[:60]}')
                  else:
                      seen[s] = n

          # ===== 2. 两个 INI:结构语法、正则可编译、组引用、文件引用 =====
          GROUP_TYPES = {'select', 'url-test', 'fallback', 'load-balance', 'relay'}
          KNOWN_KEYS = ('[custom]', 'ruleset=', 'custom_proxy_group=', 'clash_rule_base=',
                        'enable_rule_generator=', 'overwrite_original_rules=')
          for ini in ['openclash.ini', 'android.ini']:
              defined = set()
              lines = pathlib.Path(ini).read_text(encoding='utf-8').splitlines()
              for n, line in enumerate(lines, 1):
                  s = line.strip()
                  if not s or s.startswith((';', '#')):
                      continue
                  if not s.startswith(KNOWN_KEYS):
                      errors.append(f'{ini}:{n} 无法识别的行: {s[:60]}')
                  elif s.startswith('custom_proxy_group='):
                      fields = line.split('`')
                      name = fields[0][len('custom_proxy_group='):]
                      if not name:
                          errors.append(f'{ini}:{n} 策略组缺少名称')
                      if len(fields) < 4:
                          errors.append(f'{ini}:{n} 策略组 {name} 字段不完整')
                          continue
                      if fields[1] not in GROUP_TYPES:
                          errors.append(f'{ini}:{n} 策略组 {name} 类型异常: {fields[1]}')
                      if name in defined:
                          errors.append(f'{ini}:{n} 策略组重名: {name}')
                      defined.add(name)
                      pattern = fields[2]
                      if not pattern.startswith('[]'):
                          try:
                              re.compile(pattern)
                          except re.error as e:
                              errors.append(f'{ini}:{n} 策略组 {name} 正则无法编译: {e}')
              for m in re.finditer(r'^ruleset=([^,]+),(.+)$', '\n'.join(lines), re.M):
                  target, rule = m.group(1).strip(), m.group(2).strip()
                  if target not in defined and target not in BUILTIN:
                      errors.append(f'{ini}: ruleset 目标组未定义: {target}')
                  if rule.startswith(RAW):
                      p = ROOT / rule[len(RAW):].split('?')[0]
                      if not p.is_file():
                          errors.append(f'{ini}: 引用的文件不存在: {p}')
                  elif not rule.startswith(('[]', 'http')):
                      errors.append(f'{ini}: 无法识别的规则来源: {rule[:60]}')
              for line in lines:
                  if not line.startswith('custom_proxy_group='):
                      continue
                  for field in line.split('`')[2:]:
                      if not field.startswith('[]'):
                          continue
                      ref = field[2:]
                      if ref.startswith(RULE_PREFIX) or ref in BUILTIN:
                          continue
                      if ref not in defined:
                          errors.append(f'{ini}: 策略组引用未定义: {ref}')

          # ===== 3. clash-party.yaml:YAML 语法、筛选正则、规则集与文件引用 =====
          cp = yaml.safe_load(pathlib.Path('clash-party.yaml').read_text(encoding='utf-8'))
          providers = cp.get('rule-providers!') or {}
          # proxy-groups / rules 在覆写里不带感叹号,对象类键带;两种写法都兼容
          groups = cp.get('proxy-groups!') or cp.get('proxy-groups') or []
          rules_list = cp.get('rules!') or cp.get('rules') or []
          if not groups or not rules_list or not providers:
              errors.append('clash-party.yaml: 缺少 proxy-groups / rules / rule-providers! 配置段')
          gnames = {g.get('name') for g in groups if isinstance(g, dict)}
          for g in groups:
              if not isinstance(g, dict) or not g.get('name'):
                  errors.append('clash-party.yaml: 存在没有名称的策略组')
                  continue
              for key in ('filter', 'exclude-filter'):
                  v = g.get(key)
                  if isinstance(v, str):
                      try:
                          re.compile(v)
                      except re.error as e:
                          errors.append(f'clash-party.yaml: 组 {g["name"]} 的 {key} 正则无法编译: {e}')
          for r in rules_list:
              parts = r.split(',')
              if parts[0].strip() == 'RULE-SET' and parts[1].strip() not in providers:
                  errors.append(f'clash-party.yaml: 规则引用了未定义的规则集: {parts[1].strip()}')
          for name, p in providers.items():
              url = p.get('url', '')
              if url.startswith(RAW) and not (ROOT / url[len(RAW):].split('?')[0]).is_file():
                  errors.append(f'clash-party.yaml: 规则集 {name} 引用的文件不存在: {url}')
          for m in re.finditer(r'^\s+- (♻️ Gemini .+)$', pathlib.Path('clash-party.yaml').read_text(encoding='utf-8'), re.M):
              if m.group(1).strip() not in gnames:
                  errors.append(f'clash-party.yaml: Gemini 主组引用的子组未定义: {m.group(1).strip()}')

          if errors:
              print('\n'.join(errors))
              print(f'\n共 {len(errors)} 个问题')
              sys.exit(1)
          print('自动审核通过:规则语法、INI 结构与引用、覆写文件解析全部正常。')
          PYEOF

      - name: 检查换行与空白
        run: |
          git diff --check
          if git grep -qI $'\r' -- 'rules/*.list' '*.ini' 'clash-party.yaml'; then
            echo '发现 CRLF 换行,请使用 LF。' && exit 1
          fi
