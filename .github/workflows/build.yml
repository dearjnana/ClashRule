name: 自动构建规则

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clashrule-build-main
  cancel-in-progress: true

jobs:
  build:
    name: 构建、验证并发布
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: 读取本次提交
        # 固定官方动作版本，构建期间不切换到其他提交。
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # 官方第四版

      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # 官方第五版
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: 安装构建依赖
        run: python -m pip install -r tools/requirements.txt

      - name: 构建最终规则、INI、模板和索引
        run: python tools/build.py

      - name: 检查规则行为、格式和仓库引用
        run: |
          python tools/verify.py
          python tools/check_repository.py
          git diff --check

      - name: 准备已验证的转换器和内核
        # 仅下载官方固定版本，并核对发布文件的 SHA-256。
        run: |
          mkdir -p .test-work/ci-tools
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            https://github.com/Aethersailor/SubConverter-Extended/releases/download/v1.9.7/SubConverter-Extended-v1.9.7-linux-amd64.tar.gz \
            --output .test-work/ci-tools/subconverter.tar.gz
          echo 'af6f57aeb65f76c379427ab31500ad175027e2ad828a61c3b8ab5ee812efbc05  .test-work/ci-tools/subconverter.tar.gz' | sha256sum --check
          tar -xzf .test-work/ci-tools/subconverter.tar.gz -C .test-work/ci-tools
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.31/mihomo-linux-amd64-compatible-v1.19.31.gz \
            --output .test-work/ci-tools/mihomo.gz
          echo '04cf9f09671704f839ddbee2e93069dc831a4123a75281e725d1d96ab9ac1afc  .test-work/ci-tools/mihomo.gz' | sha256sum --check
          gzip -dc .test-work/ci-tools/mihomo.gz > .test-work/ci-tools/mihomo
          chmod +x .test-work/ci-tools/SubConverter-Extended/subconverter .test-work/ci-tools/mihomo

      - name: 验证 OpenClash、Android 和展开配置
        run: |
          python tools/integration_test.py \
            --subconverter-dir .test-work/ci-tools/SubConverter-Extended \
            --mihomo .test-work/ci-tools/mihomo

      - name: 自动提交生成结果
        # 内置令牌的提交不会再次触发推送工作流；不使用个人令牌。
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo '已有更新提交，本次不发布旧构建；由新任务处理。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git add -- generated/rules providers profiles templates docs/仓库文件索引.md
          if git diff --cached --quiet; then
            echo '验证通过，生成文件已是最新，无需新增提交。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '构建：自动同步规则、配置和文件索引'
          git push origin HEAD:main
          echo '验证通过，已将生成结果提交到 main。' >> "$GITHUB_STEP_SUMMARY"

      - name: 保留诊断报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # 官方第四版
        with:
          name: 构建验证报告
          retention-days: 7
          if-no-files-found: ignore
          path: |
            reports/*.json
            .test-work/integration/conversion-summary.json
            .test-work/integration/*.log
